からから:
  kana: からから
  category: ''
  definition: dry; parched; scorched; adust; sunbaked; baked
  sentences:
  - jp: おしゃべりして喉がからからになりました。
    hiragana: おしゃべり して のど が からから に なりました。
    english: My throat got dry from chatting.
  - jp: 彼はからからと笑いました。
    hiragana: かれ は からから と わらいました。
    english: He laughed loudly.
そもそも:
  kana: そもそも
  category: ''
  definition: in the first place;  to begin with;  from the start;  originally;  ab
    initio
  sentences:
  - jp: そもそもこんなところにスーパーを造ったことが問題だ。
    hiragana: そもそも こんな ところ に スーパー を つくっ た こと が もんだい だ。
    english: The problem is that they built a supermarket in a place like this to
      begin with.
  - jp: そもそもどうしてこんなばかばかしい企画が通ったのでしょうか。
    hiragana: そもそも どうして こんな ばかばかしい きかく が とおっ た の でしょ う か。
    english: How was such a ridiculous plan approved in the ﬁrst place?
  - jp: 今回の事件のそもそもの起こりは、一人の社員が会社のパソコンをうちに持ち帰ったことにあった。
    hiragana: こんかい の じけん の そもそも の おこり は、 いち にん の しゃいん が かいしゃ の パソコン を うち に もちかえっ た
      こと に あっ た。
    english: This whole incident started when an employee took one of the ofﬁce computers
      home. (lit., The very origin of this incident was in the fact that an employee
      took one of the ofﬁce computers home.)
  - jp: そもそも人間は一人で生きているのではない。
    hiragana: そもそも にんげん は いち にん で いき て いる の で は ない。
    english: To begin with, humans are not solitary beings.
  - jp: 私はそもそも、作品のいいところをコメントしないで欠点ばかり指摘する審査のやり方に賛成できない。
    hiragana: わたし は そもそも、 さくひん の いい ところ を コメント し ない で けってん ばかり してき する しんさ の やりかた に
      さんせい でき ない。
    english: To begin with, I cannot agree with our way of judging where we point
      out only the ﬂaws of a piece and never mention the good points.
  - jp: そもそも電波って何なんでしょう。
    hiragana: そもそも でんぱ って なに な ん でしょ う。
    english: So, what are radio waves in the ﬁrst place?
  - jp: そもそも一体何で君がこのパーティーにいるんだ。
    hiragana: そもそも いったい なんで きみ が この パーティー に いる ん だ。
    english: To begin with, why on earth are you at this party?
  - jp: 彼に期待したことがそもそもの間違いだった。
    hiragana: かれ に きたい し た こと が そもそも の まちがい だっ た。
    english: That we were hoping for great things from him was our ﬁrst mistake.
  - jp: 契約書に誤訳があったのがそもそもの問題だ。
    hiragana: けいやく しょ に ごやく が あっ た の が そもそも の もんだい だ。
    english: The fundamental problem was that there was a mistranslation in the contract.
  - jp: そもそもの目的は会員を増やすことだった。
    hiragana: そもそも の もくてき は かいいん を ふやす こと だっ た。
    english: The original goal was to increase our membership.
さらさら:
  kana: さらさら
  category: ''
  definition: rustling;  murmuring
  sentences:
  - jp: 小川がさらさら流れています。
    hiragana: おがわ が さらさら ながれて います。
    english: The stream is flowing smoothly.
びくびく:
  kana: びくびく
  category: ''
  definition: being afraid of;  being fearful;  being timid;  being nervous
  sentences:
  - jp: 嘘がばれないかと、びくびくした。
    hiragana: '[no kana] うそが ばれない か と、びくびくした。'
    english: I am worried that the lie I told may be exposed.
  - jp: 宿題を忘れたので先生に叱られるかもしれないと、びくびくしていた。
    hiragana: しゅくだいをわすれたのでせんせいにしかられるかもしれないと、びくびくしていた。
    english: I forgot my homework so I feared that I might be scolded by my teacher.
ばたばた:
  kana: ばたばた
  category: ''
  definition: flapping;  rattling (sound);  noisily;  clattering noise
  sentences: []
ただただ:
  kana: ただただ
  category: ''
  definition: absolutely;  only
  sentences:
  - jp: ただただ漢字を書くなんて、つまらないに決まっている。
    hiragana: ただただ かんじ を かく なんて、 つまらない に きまっ て いる。
    english: To keep writing nothing but Chinese characters is bound to be boring.
  - jp: モーツアルトが35年の生涯に６００曲以上の作品を書いたというのには、ただただ驚くよりほかはない。
    hiragana: モーツアルト が 35 ねん の しょうがい に ろく ぜろ ぜろ きょく いじょう の さくひん を かい た という の に は、
      ただただ おどろく より ほか は ない。
    english: The fact that Mozart composed more than 600 pieces during his life of
      thirty-ﬁve years is simply amazing (lit., leaves us no other choice than to
      be surprised).
  - jp: びっくりした。ただただ、ぼうぜん。あの瞬間のことは、忘れようにも忘れることができない。
    hiragana: ''
    english: Surprised. Just stunned. I couldn't forget that moment, even if I wanted
      to.
ぼろぼろ:
  kana: ぼろぼろ
  category: ''
  definition: tears or grain of rice falling
  sentences:
  - jp: 当然勝つと思っていた試合で最後に逆転負けし、 悔しさのあまりぼろぼろ泣いた。
    hiragana: とうぜん かつと おもっていた しあいで さいごに ぎゃくてん まけし、 くやしさの あまり ぼろぼろ ないた。
    english: When I lost right at the end a game I thought I should easily win, I
      cried in frustration.
なかなか:
  kana: なかなか
  category: ''
  definition: very;  considerably;  easily;  readily;  fairly;  quite;  highly;  rather
  sentences:
  - jp: 日本ではなかなか馬を見ることができません。
    hiragana: ''
    english: In Japan we rarely see horses.
  - jp: 食べる量を減らしてもなかなか体重は減らない。
    hiragana: Taberu ryō o herashite mo nakanaka taijū wa heranai.
    english: Even if I eat less food, I can't lose as much weight as I want.
  - jp: ねこは、なかなか人にはなつかない。
    hiragana: Neko wa, nakanaka hito ni wa natsukanai.
    english: Cats don't get attached to people so easily.
  - jp: 君の挨拶は、なかなか立派だったよ。
    hiragana: Kimi no aisatsu wa, nakanaka rippa datta yo.
    english: Your speech was quite good.
  - jp: この問題は、なかなか解けないと思う。
    hiragana: Kono mondai wa, nakanaka tokenai to omou.
    english: I don't think I can solve this problem easily.
  - jp: 亮くん、なかなか腕がいいね。
    hiragana: りょうくん、なかなかうでがいいね。
    english: Ryo, your skill is pretty good.
  - jp: このお酒はなかなかいけるねえ。
    hiragana: ''
    english: This sake tastes good.
  - jp: 昨日の夜は眠ろうとしてもなかなか眠れなかった。
    hiragana: 昨日[きのう]の 夜[よる]は 眠[ねむ]ろうとしてもなかなか 眠[ねむ]れなかった。
    english: Last night, even though I tried to sleep, I barely managed to get any
      sleep.
  - jp: 彼女は絵がなかなか上手です。
    hiragana: かのじょ は え が なかなか じょうず です。
    english: She's pretty good at painting.
  - jp: 荷物がなかなか届きません。
    hiragana: にもつ が なかなか とどきません。
    english: The parcel still hasn't arrived.
  - jp: 学校でのいじめはなかなか減らない。
    hiragana: がっこう で の いじめ は なかなか へらない。
    english: Bullying in schools is hard to decrease.
  - jp: あの人は若いながら（も）、なかなか有能だ。
    hiragana: あのひとはわかいながら（も）、なかなかゆうのうだ。
    english: He is young, but he is very capable.
  - jp: ブラウンさんは日本語がなかなか上手ですね。
    hiragana: ブラウンさんは にほんごが なかなか じょうず です ね。
    english: '{Mr. Brown is / Mr. Brown, you are} remarkably good at Japanese.'
  - jp: この生け花はなかなか見事に生けてある。
    hiragana: このいけばなはなかなかみごとにいけてある。
    english: This flower arrangement is done quite nicely.
  - jp: 今年は桜の花がなかなか咲きません。
    hiragana: ことしはさくらのはながなかなかさきません。
    english: It will be a long time before the cherry blossoms are out this year.
      (lit. This year the cherry blossoms do not bloom easily.)
  - jp: あの男は仕事がなかなか出来るねえ。
    hiragana: あのおとこはしごとがなかなかできるねえ。
    english: That guy does his job quite well, doesn't he?
  - jp: 山田部長の奥さんはなかなか（の）美人だ。
    hiragana: やまだぶちょうのおくさんはなかなか（の）びじんだ。
    english: The wife of our departmental chief Yamada is quite a beauty.
  - jp: この庭園はなかなか綺麗ですね。
    hiragana: このていえんはなかなかきれいですね。
    english: This garden is quite beautiful, isn't it?
  - jp: この数学の問題はなかなか難しそうだ。
    hiragana: このすうがくのもんだいはなかなかむずかしそうだ。
    english: This maths problem looks quite difficult, doesn't it?
  - jp: 君はなかなかコンピュータに強いそうじゃないか。
    hiragana: きみはなかなかコンピュータにつよういそうじゃないか。
    english: I heard that you are quite good with computers.
  - jp: この大学の学生はなかなかよく出来る。
    hiragana: このだいがくのがくせいはなかなかよくできる。
    english: The students at this college are pretty good.
  - jp: あのピアニストはモーツァルトをなかなかうまく弾く。
    hiragana: あのピアニストはモーツァルトをなかなかうまくひく。
    english: That pianist plays Mozart quite well.
  - jp: テニスは毎日練習しているのに、なかなか上手にならないんです。
    hiragana: テニスはまいにちれんしゅうしているのに、なかなかじょうずにならないんです。
    english: I am practising tennis every day, but I cannot become good at it readily.
  - jp: 約束の時間になっても友だちがなかなか来なかったので家に帰ってしまった。
    hiragana: やくそくのじかんになってもともだちがなかなかこなかったのでいえにかえってしまった。
    english: The meeting time long passed, but my friend didn't show up for a long
      time, so I went home.
  - jp: あの人はどんなに説明しても、僕の言うことがなかなか分からないようだ。
    hiragana: あのひとはどんなにせつめいしても、ぼくのいうことがなかなかわからないようだ。
    english: No matter how hard I try to explain, he doesn't seem to understand me
      easily.
  - jp: 風邪がなかなか治らないので、困っているんです。
    hiragana: かぜがなかなかなおらないので、こまっているんです。
    english: I'm having a difficult time, because my cold won't go away easily.
  - jp: フグは怖くて、なかなか食べられないんだ。
    hiragana: フグは こわくて、なかなか たべられない ん だ。
    english: I am scared of blowfish and cannot eat it easily.
  - jp: 中村先生はなかなか話せる先生だ。
    hiragana: なかむらせんせいはなかなかはなせるせんせいだ。
    english: Mr. Nakamura is a teacher who (lit. can talk with us) can understand
      us.
  - jp: 私のルームメートはなかなか（の）勉強家で、かなわない。
    hiragana: わたしのルームメートはなかなか（の）べんきょうかで、かなわない。
    english: My roommate is such a hard worker that I cannot compete with him.
  - jp: 急ぐ時に限って、バスがなかなか来ない。
    hiragana: いそぐときにかぎって、ばすがなかなかこない。
    english: Of all times, when I am in a hurry, the bus doesn't come for ages.
  - jp: あの子はまだ十五に過ぎないが、なかなかしっかりしている。
    hiragana: あのこはまだじゅうごにすぎないが、なかなかしっかりしている。
    english: That girl is only fifteen, but she is quite mature.
  - jp: 煙草は体によくないと分かりつつなかなか辞められない。
    hiragana: たばこはからだによくないとわかりつつなかなかやめられない。
    english: Although I know that smoking is harmful to my health, I just cannot quit.
  - jp: 私は年をとっている上（に）特に技能もないので、なかなか仕事が見つからない。
    hiragana: わたしはとしをとっているうえ（に）とくにぎのうもないので、なかなかしごとがみつからない。
    english: Because I am not only old but also have no special skills, it is hard
      to find a job.
  - jp: この仕事は面白くて収入もいいが、(その)反面、忙しくて自分の時間がなかなか持てないという問題もある。
    hiragana: この しごと は おもしろく て しゅうにゅう も いい が、 ( その ) はんめん、 いそがしく て じぶん の じかん が なかなか
      もて ない という もんだい も ある。
    english: This job is interesting and pays well; on the other hand, being so busy,
      I hardly ever (lit., cannot) have time for myself and that is a problem.
  - jp: 彼女はおしゃべりが好きで、とても明るい。それに加えて、なかなかユニークなキャラクターだ。
    hiragana: かのじょ は おしゃべり が すき で、 とても あかるい。 それ に くわえ て、 なかなか ユニーク な キャラクター だ。
    english: She likes to chat and is very cheerful. In addition, she has a unique
      character.
  - jp: 大学を卒業はしたものの、不況でなかなかいい仕事が見つからない。
    hiragana: だいがく を そつぎょう は し た ものの、 ふきょう で なかなか いい しごと が みつから ない。
    english: Even though I graduated from college, because of the recession I cannot
      ﬁnd a good job (despite my effort).
  - jp: 私は「結婚しない主義」でもないし、一度結婚してみたいという気もないでもないんですが、なかなかいい相手が見つかりません。
    hiragana: わたし は 「けっこん し ない しゅぎ」 で も ない し、 いちど けっこん し て み たい という き も ないでもない ん です
      が、 なかなか いい あいて が みつかり ませ ん。
    english: I am unmarried not because of principle, and I wouldn’t mind getting
      married, but it is really hard to ﬁnd a good partner.
  - jp: なんていう人か名前を忘れたけれど、なかなか魅力的な女性に出会った。
    hiragana: なんていう ひと か なまえ を わすれ た けれど、 なかなか みりょく てき な じょせい に であっ た。
    english: I met a very charming lady, although I’ve forgotten her name.
  - jp: 『美人と野獣』ともなると人気の作品だから、当日券なんてなかなか買えない。
    hiragana: 『びじん と やじゅう』 と も なる と にんき の さくひん だ から、 とうじつ けん なんて なかなか かえ ない。
    english: “Beauty and the Beast” is a popular show, so it’s hard to ﬁnd same day
      tickets.
  - jp: 昔の浮気が発覚した夫「10年たってるんだからもう時効だ」と開き直りの態度です。私にしたところで二人の子供のことを考えると離婚にはなかなか踏み切れません。
    hiragana: むかし の うわき が はっかく し た おっと 「10 ねん たってる ん だ から もう じこう だ」 と ひらきなおり の たいど
      です。 わたし にしたところで に にん の こども の こと を かんがえる と りこん に は なかなか ふみきれ ませ ん。
    english: My husband, whose past affair was discovered, turned deﬁant, saying,
      “It was 10 years ago, so it’s too late (to do anything)” I, too, couldn’t bear
      to go forward with a divorce when I thought about our two children.
  - jp: 今の社宅は一般の賃貸に比べて格段に安いのであまり文句は言えないのだが、建物が古いのはいいとしても、傷んだところをなかなか補修してもらえないのは問題だ。
    hiragana: いま の しゃたく は いっぱん の ちんたい に くらべ て かくだん に やすい ので あまり もんく は いえ ない の だ が、
      たてもの が ふるい の はいいとしても、 いたん だ ところ を なかなか ほしゅう し て もらえ ない の は もんだい だ。
    english: The rent for the company house (we live in) now is much cheaper than
      that of ordinary houses, so we can’t complain much. And even though we accept
      the old building, the fact that we can’t get repairs done quickly when something
      is damaged is a problem.
  - jp: 新しい服を買ったものの、なかなか着ていく機会がない。
    hiragana: あたらしい ふく を かった ものの、 なかなか きていく きかい が ない 。
    english: Although I bought new clothes, I don't have any opportunity to wear them.
  - jp: 夏休みがもうすぐ終わるので宿題を完成させなきゃと思いつつも、なかなか進まない。
    hiragana: なつやすみがもうすぐおわるのでしゅくだいをかんせいさせなきゃとおもいつつも、なかなかすすまない。
    english: Even though I know I have to finish my homework because the summer holiday
      is ending soon, I can't make any progress.
  - jp: 子供向けの映画だから１時間半くらいで終わるかと思いきや、なかなか終わらない。
    hiragana: こども　むけ　の　えいが　だ　から　いちじかん　はん　くらい　で　おわる　か　とおもいきや、　なかなか　おわらない。
    english: It’s a children’s film, so I thought it’d be over in an hour and a half
      or so, but it just keeps going.
  - jp: 今年の冬はひどい風邪をひいてしまい、仕事になかなかもどれなかった。
    hiragana: ''
    english: ++This winter I caught a bad cold and had difficulty getting back to
      work.
  - jp: それはなかなか説得力のある考えだったが、なぜか私は納得しなかった。
    hiragana: ''
    english: That was a very persuasive argument, but somehow I was not convinced.
どきどき:
  kana: どきどき
  category: ''
  definition: to beat fast (of one's heart);  to throb;  to pound;  to palpitate
  sentences:
  - jp: みんなの前で歌を歌うのはどきどきする。
    hiragana: ''
    english: As for singing in front of everyone, my heart pounds!
  - jp: 彼女に会うとどきどきします。
    hiragana: かのじょ に あう と どきどき します。
    english: I feel nervous when I see her.
  - jp: 手と手が触れてどきどきしたよ。
    hiragana: て と て が ふれて どきどき した よ。
    english: My heart pounded as our hands touched.
  - jp: 彼女は内心どきどきしていましたよ。
    hiragana: かのじょ は ないしん どきどき して いました よ。
    english: She was nervous on the inside.
ぶつぶつ:
  kana: ぶつぶつ
  category: ''
  definition: grunt;  grumble;  complaint;  mutter
  sentences:
  - jp: 彼はぶつぶつと独り言を言ったんだ。
    hiragana: かれ は ぶつぶつ と ひとりごと を いった ん だ。
    english: He mumbled to himself.
しばしば:
  kana: しばしば
  category: ''
  definition: often;  again and again;  frequently
  sentences:
  - jp: 課長はしばしば出張します。
    hiragana: かちょう は しばしば しゅっちょうします。
    english: The section chief often goes on business trips.
  - jp: 日本人はいかにしばしば内と外の行動を区別することか。
    hiragana: にっぽんじん は いかに しばしば うち と そと の こうどう を くべつ する ことか。
    english: How often Japanese differentiate their behaviour in inside and outside
      spaces!
  - jp: 子供にお金をかければそれだけ愛情を注いだことになる、という間違った思い込みがしばしばあるようだ。
    hiragana: こども に おかね を かけれ ば それだけ あいじょう を そそい だ こと に なる、 という まちがっ た おもいこみ が しばしば
      ある よう だ。
    english: It seems that it’s a common, and mistaken, assumption that the amount
      of money you spend on your children equals the amount of affection you’ve given
      them.
ぴかぴか:
  kana: ぴかぴか
  category: ''
  definition: glitter; sparkle
  sentences:
  - jp: 新車はぴかぴかですね。
    hiragana: しんしゃ は ぴかぴか です ね。
    english: The new car is really shiny.
まごまご:
  kana: まごまご
  category: ''
  definition: confused
  sentences: []
はきはき:
  kana: はきはき
  category: ''
  definition: briskly;  smartly;  promptly;  clearly;  lucidly
  sentences:
  - jp: はきはきと意見を言ってください。
